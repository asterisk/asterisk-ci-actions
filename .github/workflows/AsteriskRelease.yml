name: Release
on:
  workflow_call:
    inputs:
      release_type:
        description: |
          Release Type:
        required: true
        type: string
      new_version:
        description: |
          New Version
          Examples:
            21.4.0-rc1, 21.4.0-rc2, 21.4.0, 21.4.1
            certified/21.4-cert1-rc1, certified/21.4-cert1
        required: true
        type: string
      advisories:
        description: |
          Comma separated list of advisories.
          NO SPACES
          Example: GHSA-4xjp-22g4-9fxm,GHSA-4xjp-22g4-zzzz
        required: false
        type: string
      skip_cherry_pick:
        description: |
          Skip automatic cherry-pick for regular RC1 releases?
        required: false
        type: boolean
        default: false
      force_cherry_pick:
        description: |
          Force cherry-pick for non-RC1 releases?
        required: true
        type: boolean
        default: false
      skip_test_builds:
        description: |
          Skip test builds?
        required: false
        type: boolean
        default: false
      push_release_branches:
        description: |
          Push release branches live?
        required: true
        type: boolean
        default: false
      create_github_release:
        description: |
          Create the GitHub release?
        required: true
        type: boolean
        default: false
      push_tarballs:
        description: |
          Push tarballs to downloads server?
        required: true
        type: boolean
        default: false
      send_email:
        description: 'Send announcement emails? (WordPress news publishes only for GA releases.)'
        required: true
        type: boolean
        default: false
    secrets:
      asteriskteam_gh_token:
        required: true
      gpg_private_key:
        required: true
      asteriskteam_email_username:
        required: true
      asteriskteam_email_secret:
        required: true
      ASTERISK_WORDPRESS_AUTH_PASSWORD:
        required: true
      ASTERISK_WORDPRESS_AUTH_USER:
        required: true
      deploy_ssh_priv_key:
        required: true
      deploy_ssh_username:
        required: true

permissions:
  actions: write
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

env:
  REPO:            ${{ github.repository }}
  REPO_DIR:        ${{ github.workspace }}/${{ github.event.repository.name }}
  REPO_ORG:        ${{ github.event.repository.owner.login }}
  WORKFLOW_NAME:   ${{ github.workflow }}
  WORKFLOW_RUN_ID: ${{ github.run_id }}

  NEW_VERSION:           ${{inputs.new_version}}
  SECURITY:              ${{inputs.release_type == 'SECURITY'}}
  ADVISORIES:            ${{inputs.advisories}}
  HOTFIX:                ${{inputs.release_type == 'HOTFIX'}}
  SKIP_CHERRY_PICK:      ${{inputs.skip_cherry_pick}}
  FORCE_CHERRY_PICK:     ${{inputs.force_cherry_pick}}
  SKIP_TEST_BUILDS:      ${{inputs.skip_test_builds}}
  PUSH_BRANCHES:         ${{inputs.push_release_branches}}
  CREATE_GITHUB_RELEASE: ${{inputs.create_github_release}}
  PUSH_TARBALLS:         ${{inputs.push_tarballs}}
  SEND_EMAIL:            ${{inputs.send_email}}

  PRODUCT:           ${{vars.PRODUCT_NAME}}
  MAIL_LIST_GA:      ${{vars.MAIL_LIST_GA}}
  MAIL_LIST_RC:      ${{vars.MAIL_LIST_RC}}
  MAIL_LIST_CERT_GA: ${{vars.MAIL_LIST_CERT_GA}}
  MAIL_LIST_CERT_RC: ${{vars.MAIL_LIST_CERT_RC}}
  MAIL_LIST_SEC:     ${{vars.MAIL_LIST_SEC_ADV}}
  ADV_URL_BASE:      ${{vars.SEC_ADV_URL_BASE}}
  DEPLOY_HOST:       ${{vars.DEPLOY_HOST}}
  DEPLOY_DIR:        ${{vars.DEPLOY_DIR}}
  FPBX_ISSUE_REPO:   ${{vars.FPBX_ISSUE_REPO}}

concurrency:
  group: Releaser
  queue: max

jobs:
  Release:
    name: Release
    runs-on: ubuntu-latest
    steps:
        # ACTIONS_PATH, SCRIPT_DIR, NORMALIZED_BRANCH env vars
      - name: SetupRunner
        uses: asterisk/asterisk-ci-actions/SetupRunner@main
        with:
          apt_packages: ${{ vars.ASTERISK_RUNNER_APT_PACKAGES }}
          apt_timeout: ${{ vars.ASTERISK_RUNNER_APT_TIMEOUT }}
          apt_retries: ${{ vars.ASTERISK_RUNNER_APT_RETRIES }}
          apt_http_timeout: ${{ vars.ASTERISK_RUNNER_APT_HTTP_TIMEOUT }}
          install_sipp: false

      - name: Release
        id: releaser
        env:
          GH_TOKEN: ${{ secrets.asteriskteam_gh_token }}
          GPG_PRIVATE_KEY: ${{ secrets.gpg_private_key }}
          DEPLOY_SSH_PRIV_KEY: ${{ secrets.deploy_ssh_priv_key }}
          DEPLOY_SSH_USERNAME: ${{ secrets.deploy_ssh_username }}
        run: |
          # Run the release script
          ${SCRIPT_DIR}/Releaser/runAsteriskReleaser.sh --debug

      - name: Save Output
        id: save-output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.PRODUCT}}-${{env.NEW_VERSION}}
          path: ${{env.PRODUCT}}-${{env.NEW_VERSION}}

      - name: Send Release Announcements
        if: inputs.send_email && steps.releaser.outputs.mail_list != 'none'
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: email-smtp.us-east-1.amazonaws.com
          server_port: 587
          secure: false
          username: ${{ secrets.asteriskteam_email_username }}
          password: ${{ secrets.asteriskteam_email_secret }}
          subject: ${{ steps.releaser.outputs.subject }}
          to: ${{ steps.releaser.outputs.mail_list }}
          from: Asterisk Development Team <asteriskteam@sangoma.com>
          body: "file://${{github.workspace}}/${{steps.releaser.outputs.email_announcement}}"
          reply_to: no-reply+asteriskteam@sangoma.com
          ignore_cert: true
          convert_markdown: false

      - name: Setup Node for WordPress
        if: inputs.send_email && steps.releaser.outputs.release_type == 'ga'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish Asterisk News
        if: inputs.send_email && steps.releaser.outputs.release_type == 'ga'
        shell: bash
        run: |
          npm install --prefix "${RUNNER_TEMP}/wp-post" --no-save --package-lock=false --ignore-scripts wp-post@1.2.0

          WP_SOURCE_FILE="${GITHUB_WORKSPACE}/${{ steps.releaser.outputs.email_announcement }}"
          WP_POST_FILE="${RUNNER_TEMP}/wp-email-announcement-${NEW_VERSION}.md"
          {
            printf -- '---\ntitle: %s %s Released\nstatus: publish\n---\n' "${PRODUCT^}" "${NEW_VERSION}"
            cat "${WP_SOURCE_FILE}"
          } > "${WP_POST_FILE}"

          NODE_PATH="${RUNNER_TEMP}/wp-post/node_modules" node "${SCRIPT_DIR}/Releaser/post_news.js" \
            --file "${WP_POST_FILE}" \
            --api-url "${{ vars.ASTERISK_WORDPRESS_API_URL }}" \
            --user "${{ secrets.ASTERISK_WORDPRESS_AUTH_USER }}" \
            --password "${{ secrets.ASTERISK_WORDPRESS_AUTH_PASSWORD }}" \
            --post-endpoint "asterisk-news"

          rm -f "${WP_POST_FILE}"

      - name: Open FPBX Issue
        if: inputs.send_email && steps.releaser.outputs.release_type == 'ga'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.asteriskteam_gh_token }}
        run: |
          gh issue create -R ${FPBX_ISSUE_REPO} \
            --title "Asterisk Version ${NEW_VERSION} Has Been Released" \
            --body "Release Notes: https://github.com/asterisk/asterisk/releases/tag/${NEW_VERSION}" 
